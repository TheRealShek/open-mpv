[package]
name = "open-mpv"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/TheRealShek/open-mpv"

[dependencies]
glycin = { version = "3.1.0", features = ["gdk4", "async-io"] }
gstreamer = "0.25.3"
gtk4 = { version = "0.11.4", features = ["gio_v2_80", "v4_18", "v4_22"] }
gufo-common = "1.1.0"

[profile.release]
lto = "thin"
strip = true

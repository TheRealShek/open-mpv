name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check changed paths
    runs-on: ubuntu-24.04
    outputs:
      run_checks: ${{ steps.classify.outputs.run_checks }}

    steps:
      - name: Decide whether code checks are needed
        id: classify
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = pull_request ]; then
            changed_files=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
          else
            changed_files=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
              --jq '.files[] | .filename, (.previous_filename // empty)')
          fi

          run_checks=false
          while IFS= read -r changed_file; do
            [ -n "$changed_file" ] || continue
            case "$changed_file" in
              *.md|docs/*|LICENSE) ;;
              *) run_checks=true; break ;;
            esac
          done <<EOF
          $changed_files
          EOF

          echo "run_checks=${run_checks}" >> "$GITHUB_OUTPUT"

  checks:
    name: Required checks
    needs: changes
    if: >-
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.run_checks == 'true')
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      XDG_RUNTIME_DIR: /tmp/open-mpv-runtime

    steps:
      - name: Install Fedora dependencies
        run: |
          dnf --setopt=install_weak_deps=False -y install \
            ImageMagick \
            ShellCheck \
            appstream \
            cargo \
            clippy \
            dbus-daemon \
            desktop-file-utils \
            gcc \
            git \
            glycin-devel \
            glycin-loaders \
            gstreamer1-devel \
            gstreamer1-plugin-gtk4 \
            gstreamer1-plugins-good \
            gtk4-devel \
            pkgconf-pkg-config \
            rpm-build \
            rust \
            rustfmt

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure compiler cache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          disable_annotations: true
          version: v0.17.0

      - name: Enable compiler cache
        if: steps.sccache.outcome == 'success'
        run: |
          echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
          echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
          echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
          echo 'SCCACHE_IGNORE_SERVER_IO_ERROR=1' >> "$GITHUB_ENV"

      - name: Validate repository files
        run: |
          shellcheck install.sh uninstall.sh packaging/build-rpm.sh
          sh -n install.sh uninstall.sh packaging/build-rpm.sh
          desktop-file-validate data/io.github.TheRealShek.OpenMpv.desktop
          appstreamcli validate --no-net data/io.github.TheRealShek.OpenMpv.metainfo.xml
          rpmspec -P packaging/fedora/open-mpv.spec >/dev/null

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        env:
          # Clippy must analyze every crate, so compiler caching only adds overhead.
          RUSTC_WRAPPER: ""
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: |
          install -d -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Report compiler cache statistics
        if: steps.sccache.outcome == 'success'
        continue-on-error: true
        run: sccache --show-stats

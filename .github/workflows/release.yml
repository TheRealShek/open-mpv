name: Package signed release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to verify and prepare (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
      tag_sha: ${{ steps.tag.outputs.tag_sha }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: python3 packaging/release.py validate --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT"

  release:
    needs: validate
    name: Verify, package and prepare
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      XDG_RUNTIME_DIR: /tmp/open-mpv-runtime

    steps:
      - name: Install Fedora dependencies
        run: |
          dnf --setopt=install_weak_deps=False -y install \
            ImageMagick \
            ShellCheck \
            appstream \
            cargo \
            clippy \
            dbus-daemon \
            desktop-file-utils \
            gcc \
            gh \
            glycin-devel \
            glycin-loaders \
            gstreamer1-devel \
            gstreamer1-plugin-gtk4 \
            gstreamer1-plugins-good \
            gtk4-devel \
            python3 \
            python3-rpm \
            rpm-build \
            rpmlint \
            rust \
            rustfmt

      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools
          persist-credentials: false

      - name: Move release tooling outside the source archive
        run: mv .release-tools "$RUNNER_TEMP/release-tools"

      - name: Restore completed draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.validate.outputs.commit_sha }}
          TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
        run: python3 "$RUNNER_TEMP/release-tools/packaging/release.py" restore --tag "$RELEASE_TAG" --commit "$COMMIT" --tag-sha "$TAG_SHA"

      - name: Run required checks
        run: |
          install -d -m 700 "$XDG_RUNTIME_DIR"
          python3 -m unittest discover -s "$RUNNER_TEMP/release-tools/packaging/tests" -v
          shellcheck install.sh uninstall.sh packaging/build-rpm.sh
          sh -n install.sh uninstall.sh packaging/build-rpm.sh
          desktop-file-validate data/io.github.TheRealShek.OpenMpv.desktop
          appstreamcli validate --no-net data/io.github.TheRealShek.OpenMpv.metainfo.xml
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          dbus-run-session -- cargo test --locked
          cargo build --release --locked

      - name: Build and inspect RPM
        run: |
          if [ ! -f dist/open-mpv-fedora44-x86_64.rpm ]; then
            ./packaging/build-rpm.sh "$RELEASE_TAG"
          fi
          test "$(rpm -qp --qf '%{NAME}:%{VERSION}:%{ARCH}' dist/open-mpv-fedora44-x86_64.rpm)" = "open-mpv:${RELEASE_TAG#v}:x86_64"
          (cd dist && sha256sum -c SHA256SUMS)
          rpmlint dist/open-mpv-fedora44-x86_64.rpm
          rpm -qpl dist/open-mpv-fedora44-x86_64.rpm
          rpm -qp --requires dist/open-mpv-fedora44-x86_64.rpm
          rpm -qp --provides dist/open-mpv-fedora44-x86_64.rpm | grep -q 'mimehandler(image/jpeg)'
          rpm -qp --provides dist/open-mpv-fedora44-x86_64.rpm | grep -q 'mimehandler(video/mp4)'

      - name: Test package lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf -y install ./dist/open-mpv-fedora44-x86_64.rpm
          rpm -V open-mpv
          test -x /usr/bin/open-mpv
          desktop-file-validate /usr/share/applications/io.github.TheRealShek.OpenMpv.desktop
          dnf -y reinstall ./dist/open-mpv-fedora44-x86_64.rpm
          rpm -V open-mpv
          dnf -y remove open-mpv
          test ! -e /usr/bin/open-mpv
          test ! -e /usr/share/applications/io.github.TheRealShek.OpenMpv.desktop
          test ! -e /usr/share/licenses/open-mpv
          test ! -e /usr/share/metainfo/io.github.TheRealShek.OpenMpv.metainfo.xml

          python3 "$RUNNER_TEMP/release-tools/packaging/release.py" predecessor --tag "$RELEASE_TAG"
          if [ -f dist/previous.rpm ]; then
            previous_rpm=dist/previous.rpm
            previous_evr=$(rpm -qp --qf '%{EPOCHNUM}:%{VERSION}-%{RELEASE}' "$previous_rpm")
            current_evr=$(rpm -qp --qf '%{EPOCHNUM}:%{VERSION}-%{RELEASE}' dist/open-mpv-fedora44-x86_64.rpm)
            dnf -y install "$previous_rpm"
            dnf -y install ./dist/open-mpv-fedora44-x86_64.rpm
            test "$(rpm -q --qf '%{EPOCHNUM}:%{VERSION}-%{RELEASE}' open-mpv)" = "$current_evr"
            dnf -y downgrade "$previous_rpm"
            test "$(rpm -q --qf '%{EPOCHNUM}:%{VERSION}-%{RELEASE}' open-mpv)" = "$previous_evr"
            dnf -y install ./dist/open-mpv-fedora44-x86_64.rpm
            dnf -y remove open-mpv
          fi

      - name: Resume draft GitHub release
        env:
          COMMIT: ${{ needs.validate.outputs.commit_sha }}
          TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-tools/packaging/release.py" upload --tag "$RELEASE_TAG" --commit "$COMMIT" --tag-sha "$TAG_SHA"
